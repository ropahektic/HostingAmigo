[project]
name = "wormnetbot"
version = "0.1.0"
description = "Standalone WormNET bot scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wormnetbot = "wormnetbot.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
