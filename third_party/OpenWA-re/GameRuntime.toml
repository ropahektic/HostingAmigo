[[function]]
va = 0x0053DF00
name = "NetSession__ProcessNetworkFrame"
calling_convention = "__stdcall"
custom_storage = true
plate_comment = """
Net-frame catch-up pump. `this` (ESI) is the NetSession / NetInputCtrl
(GameWorld+0x1c); the caller (DispatchFrame 0x529160) loads ESI from
`world.net_session` and only calls this when it's non-null. Maintains a 64-bit
timer baseline at this+0xE88/0xE8C (pre-seeded to -1 by NetInputCtrl::Init so
the first call latches baseline = elapsed). While `elapsed - baseline >=
freq/50` it calls `this->vtable[1]` (NetInputCtrl slot 1, 0x0058C3D0) and
advances baseline by one 50 Hz frame.
"""

