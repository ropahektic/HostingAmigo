name = "GameRuntime__OnRoundEndingCountdown"
calling_convention = "__stdcall"
custom_storage = true
plate_comment = "Drives the ~1-second delay between game_state = ROUND_ENDING (4) and EXIT (5). Per frame: (1) calls world_root.hud_data_query(0x7d3, 0x394, buf) for end-of-round stats side effects, (2) if game_end_clear > 0, decrements and clamps at 0, else (3) advances game_end_speed by Fixed(0x51E) until it reaches 1.0, then sets game_state = EXIT. usercall: ESI = this. No stack params, RET. Only WA-side caller was GameRuntime__StepFrame (also Rust)."

