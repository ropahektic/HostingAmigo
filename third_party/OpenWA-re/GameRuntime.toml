[[vtable]]
name = "GameRuntimeVtable"
va = 0x0066A30C
size = 10
plate_comment = """
GameRuntime vtable — 10 slots. Slot 5 is the cross-class no-op stub
`Stub_Void_Ret8` (shared by ~48 vtables); the other nine slots are
class-specific. The scalar deleting destructor lives at slot 6, not 0.
"""

  [[vtable.slot]]
  index = 0
  name = "load_resource_list"
  wa_function = "DDNetGameWrapper__LoadResourceList"
  doc = "Load resource list (0x005713C0). Earlier guesses had this slot mislabelled as the destructor — that's actually slot 6."

  [[vtable.slot]]
  index = 1
  name = "display_dispatch_slot1_maybe"
  wa_function = "GameRuntime__DisplayDispatchSlot1_Maybe"
  doc = "Six-arg pass-through into `display.vtable[+0x78]` (display slot 30). Exact role TBD — see plate on the linked function."

  [[vtable.slot]]
  index = 2
  name = "send_game_state"
  wa_function = "DDNetGameWrapper__SendGameState"
  doc = "Send-game-state hook (`DDNetGameWrapper__SendGameState` base impl). Called by StepFrame's end-of-game headless log before draining the input queue: thiscall(this=wrapper, buf=render_buffer_a, 0, 0). In non-network wrappers the base impl is a no-op path; the net subclass overrides to flush queued network state."

  [[vtable.slot]]
  index = 3
  name = "write_replay_messages"
  wa_function = "GameRuntime__WriteReplayMessages"
  doc = "Flush compressed entity-message payload for the current frame to the replay FILE* at `this+0x4BC`."

  [[vtable.slot]]
  index = 4
  name = "load_replay_header_maybe"
  wa_function = "GameRuntime__LoadReplayHeader_Maybe"
  doc = "Read header/init sections from the replay FILE* at `this+0x4B8` and reset per-load state. `_Maybe` until the second-arg layout is nailed down."

  [[vtable.slot]]
  index = 6
  name = "scalar_deleting_destructor"
  wa_function = "GameRuntime__ScalarDeletingDestructor"
  doc = "Standard MFC scalar deleting destructor — calls `EndGame` then conditionally `WA_Free`."

  [[vtable.slot]]
  index = 7
  name = "render_frame"
  wa_function = "GameRuntime__RenderFrame"
  doc = "Render frame (0x56E040) — called each frame from `GameSession__ProcessFrame`."

  [[vtable.slot]]
  index = 8
  name = "save_replay_state"
  wa_function = "GameRuntime__SaveReplayState"
  doc = "Snapshot the round-state half of a recording-frame payload. Invoked by `GameEngine::Shutdown` (0x0056DCD0)."

  [[vtable.slot]]
  index = 9
  name = "get_game_state"
  wa_function = "GameRuntime__GetGameState"
  doc = "Get game state (0x528A20) — returns `self.game_state` (+0x484)."
