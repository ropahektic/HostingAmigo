name = "GameNet__IsBroadcastTag"
plate_comment = "Predicate: is this message tag in the broadcast/re-queue set {0x6,0xd,0xf,0x6d,0x6e,0x6f,0x70,0x74}? Controls whether a received/resynced message is re-queued into the local BufferObject."

