name = "GameNet__update_incoming_0"

[[function]]
va = 0x0053E020
name = "GameNet__update_incoming_1"
plate_comment = "Receive drain. Loops calling NetSession vtable slot 11 (WS_GameNet__ReceivePacket) to pull one queued peer packet at a time (while highest_incoming_use < 0x32). Each packet is LZ77-decompressed into send_staging and either handed to GameNet__update_application (decode OK) or buffered as a raw 0x6e/0x74 BufferObject message for later. Called unconditionally every net-frame from WS_GameNet__update (PUSH ESI; CALL — this on stack, RET 0x4)."
calling_convention = "__stdcall"

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "this"
  type = "NetInputCtrl *"

[[function]]
va = 0x0053E170
name = "GameNet__update_application"

[[function]]
va = 0x0053E380
name = "GameNet__send_block"
plate_comment = "Drains the outgoing message ring (input_ring +0x20 node list) into send_staging (+0x56C), LZ77-compresses it into wire_scratch (+0x96C), and emits via NetSession vtable slot 12 (+0x30). Bails if MaxActivePeerScore >= 0x4b (peers too far behind)."
calling_convention = "__stdcall"
custom_storage = true

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "this"
  type = "NetInputCtrl *"
  storage = "EAX"

[[function]]
va = 0x0053E490
name = "GameNet__transmit"

[[function]]
va = 0x0053E4E0
name = "GameNet__HandlePeerStateChange"
plate_comment = "Peer state-change handler. kind 3 = full resync (rebuild the peer's incoming RingBuffer, re-queueing broadcast-class messages); kind 2 = disconnect request. Always emits a 0x6d peer-event message. Returns a grace countdown (0 / 0x19 / 0x32) for the caller to seed."
calling_convention = "__thiscall"
custom_storage = true

  [function.signature]
  returns = "int"

  [[function.param]]
  name = "this"
  type = "NetInputCtrl *"
  storage = "ECX"

  [[function.param]]
  name = "peer_idx"
  type = "int"
  storage = "stack:0x4"

  [[function.param]]
  name = "kind"
  type = "int"
  storage = "stack:0x8"

