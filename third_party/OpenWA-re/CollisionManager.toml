calling_convention = "__stdcall"
custom_storage = true
plate_comment = "Per-tick projectile-style sub-step used by `StepRopePhysics_Maybe`'s rope-attached path. Advances the entity one sub-step under combined rope tension + gravity, performing the inner segment iteration and calling `WorldEntity__CheckMoveCollision` to detect terrain contact. Returns the colliding `WorldEntity *` on a hit, else NULL. `this` arrives in EAX; three stack args (cm, &budget, &tick_fraction). RET 0xC. Reachable only via the rope-attached branch, so `this` is always a worm in practice, but the function only touches WorldEntity-level fields."

