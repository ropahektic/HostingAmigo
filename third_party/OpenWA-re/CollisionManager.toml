custom_storage = true
plate_comment = "Rope-mode collision/integration sweep used by `WorldEntity__StepRopePhysics_Maybe` when the entity is _not_ rope-attached (+0xBC == 0). Reads `this->speed_x/y` (via ESI), advances against the per-class entity list, returns the colliding `WorldEntity *` on a terminating contact (else NULL). Three stack params: the world's collision manager, an `out` slot that receives a 1..4 face code on contact, and the sub-frame `tick_fraction` (in/out, decremented by the integrator). RET 0xC."

  [function.signature]
  returns = "WorldEntity *"

