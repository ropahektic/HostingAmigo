[[function]]
va = 0x004FB490
name = "CollisionManager__Init"
plate_comment = """
Init the CollisionManager (at GameWorld+0x528) after the caller wrote
the vtable. Sets the global entity DwordList at +0x18 (capacity=0x100,
data=0x420 byte buffer) and the 32 per-class buckets at +0x28..+0x228
to the same shape. The vtable and the +0x240 GameWorld back-pointer
are written by the allocator (not this fn).

Ported as `engine::collision_manager::collision_manager_init`; the WA
function takes a pointer offset 0x14 *into* CollisionManager (so its
writes look like `[+0x4..]` relative to that pointer).
"""

