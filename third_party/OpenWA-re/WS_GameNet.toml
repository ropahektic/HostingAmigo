[[function]]
va = 0x0058C3D0
name = "WS_GameNet__update"
plate_comment = "NetSession vtable slot 1 — the 50 Hz per-net-frame handler, called in a loop from NetSession__ProcessNetworkFrame (0x53DF00). Steps: (1) host (self_peer_idx==0) → WS_GameNet__update_mask; client → eager release_peer_maybe(0,2) if peer_playing[0]>0 && conn[0]->state(+0xB8)!=3. (2) per-peer receive-countdown sweep: decrement peer_recv_countdown[i] (+0x176C); on reaching 0, WS_GameNet__PeerTimeout(reason=peer_disconnect_reason[i]). (3) periodic send — decrement send_countdown (+0x1c) and, when it expires or the outgoing ring is >=75% full, call GameNet__send_block + reset to 0x32. (4) receive drain — always call GameNet__update_incoming_1. So even an idle host emits a ~1 Hz keep-alive here."
calling_convention = "__thiscall"
custom_storage = true

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "this"
  type = "NetInputCtrl *"
  storage = "ECX"

