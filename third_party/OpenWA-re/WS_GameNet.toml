[[function]]
va = 0x0058C7B0
name = "WS_GameNet__ReceivePacket"
calling_convention = "__thiscall"
custom_storage = true
plate_comment = """
NetSession vtable slot 11. Receives one framed packet from a peer's MsgConnection (slot 4,
+0x10) into recv scratch (NetInputCtrl+0xF34); returns the payload byte count (>0) or 0 when
the socket is empty. *out_peer = source peer index, *out_seq_delta = sequence delta vs
peer_last_seq[peer] (+0x1738), then peer_last_seq[peer] = seq+1.

Star topology: on the HOST (self_peer_idx == 0) this also RELAYS the received packet to every
other active peer via MsgConnection::Send (slot 13, +0x34) — clients only talk to the host and
the host fans out, so the session behaves like a full mesh. Wire header (first dword at +0xF34):
low nibble = source peer, high nibble (>>4) = command tag (0 = data; nonzero →
WS_GameNet__process_command), dword>>8 = 24-bit sequence. Payload follows the 4-byte header.
"""

  [function.signature]
  returns = "int"

  [[function.param]]
  name = "this"
  type = "NetInputCtrl *"
  storage = "ECX"

  [[function.param]]
  name = "out_peer"
  type = "int *"
  storage = "stack:0x4"

  [[function.param]]
  name = "payload_dst"
  type = "void *"
  storage = "stack:0x8"

  [[function.param]]
  name = "header_buf"
  type = "void *"
  storage = "stack:0xC"

  [[function.param]]
  name = "out_seq_delta"
  type = "int *"
  storage = "stack:0x10"

[[function]]
va = 0x0058CA20
name = "WS_GameNet__update_mask"
plate_comment = "Host-side connection-mask gossip (called from WS_GameNet__update when self_peer_idx == 0). Per peer 1..peer_count: if peer_playing[peer] > 0 and the peer connection's state byte (+0xB8) != 3 (connected), calls SetPeerState(peer, 2) to re-arm/transition it. Then recomputes a live-peer bitmask (field_17d8) and, if it changed, sends it via WS_GameNet__send (4 bytes, tag nibble 1). this = EAX."
calling_convention = "__stdcall"
custom_storage = true

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "this"
  type = "NetInputCtrl *"
  storage = "EAX"

