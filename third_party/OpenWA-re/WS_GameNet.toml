[[function]]
va = 0x0058C520
name = "WS_GameNet__SetPeerState"
plate_comment = """
NetSession vtable slot 3 (the abstract `set_peer_state`). Per-peer connection-state transition —
NOT a teardown despite the old `disconnect` name. thiscall(this=ECX, peer_idx, kind), RET 0x8.
Calls GameNet__HandlePeerStateChange(peer, kind) to get a grace countdown; if nonzero it arms
peer_recv_countdown[peer] (+0x176C) = grace and peer_disconnect_reason[peer] (+0x17A0) = kind, and
sets peer_playing[peer] (+0xECC) = -(kind != 3). If grace is 0 (or HandlePeerStateChange says the
peer is gone) it falls through to WS_GameNet__PeerTimeout (-2 + disconnect). Guarded at entry by
`if (peer == self_peer_idx) return 0` and `if (peer_playing[peer] < 0) return 0`. Driven each frame
by the connection-mask gossip (WS_GameNet__update_mask on the host, WS_GameNet__process_mask on a
client) — so a peer stays armed only while mask packets keep flowing."""
calling_convention = "__thiscall"
custom_storage = true

  [function.signature]
  returns = "int"

  [[function.param]]
  name = "this"
  type = "NetInputCtrl *"
  storage = "ECX"

  [[function.param]]
  name = "peer_idx"
  type = "int"
  storage = "stack:0x4"

  [[function.param]]
  name = "kind"
  type = "int"
  storage = "stack:0x8"

[[function]]
va = 0x0058C5C0
name = "WS_GameNet__PeerTimeout"
plate_comment = "Per-peer receive-timeout handler. Called from WS_GameNet__update when a peer's receive countdown (NetInputCtrl+0x176C+peer*4) decrements to 0. Writes peer_playing[peer] = -2 (NetInputCtrl+0xECC+peer*4), emits a 0x6d peer-event message, stores the disconnect reason in the MsgConnection (+0xE8), closes the connection (MsgConnection vtable slot 3), and notifies the GameWorld (Game__sub_52E4B0). On the client (self_peer_idx != 0) it also marks every other peer -2. This (not WS_GameNet__disconnect) is the writer of the -2 'timed out' sentinel that drives the loopback no-turns deadlock."
calling_convention = "__stdcall"
custom_storage = true

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "this"
  type = "NetInputCtrl *"
  storage = "ESI"

  [[function.param]]
  name = "peer_idx"
  type = "int"
  storage = "EDI"

  [[function.param]]
  name = "reason"
  type = "int"
  storage = "stack:0x4"

