plate_comment = "NetSession vtable slot 7. Returns `peer_playing[peer] > 0` (NetInputCtrl+0xECC+peer*4). TurnGame_AutoSelectTeams (0x5611E0) reads this to decide whether to auto-forfeit a team: a peer that has timed out (PeerTimeout wrote -2) reads as not-playing and its team is surrendered."
calling_convention = "__thiscall"
custom_storage = true

