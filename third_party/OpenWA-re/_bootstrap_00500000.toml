[[function]]
va = 0x005008D0
name = "InitWormAttachedRope"
plate_comment = """
Allocates the worm's attached-rope state when a ninja rope or bungee rope hooks: `wa_malloc`s the 64-slot `RopeSegment` ring into `WorldEntity.rope_segments`, seeds `rope_segment_count` and `rope_attached = 1` (the gate read by everything from `DrawAttachedRope` to `StepRopePhysics_Maybe` to the WorldEntity destructor's free path).

The earlier Ghidra-side name `InitBungeeTrail` was a misnomer — there is no separate "BungeeTrail" object; this is the shared init for both ninja rope and bungee, hung off the WormEntity.
"""

[[function]]
va = 0x00505430
name = "StubRetZero_Ret8"
calling_convention = "__thiscall"
custom_storage = true
plate_comment = """
Shared cross-class no-op stub. `XOR EAX, EAX; RET 0x8`. Populates
vtable slots that subclasses are expected to override; never called
when the canonical impl is in place. Two stack args (treated as opaque
by the stub).
"""

  [function.signature]
  returns = "uint"

  [[function.param]]
  name = "this"
  type = "void *"
  storage = "ECX"

  [[function.param]]
  name = "param_1"
  type = "uint"
  storage = "stack:0x4"

  [[function.param]]
  name = "param_2"
  type = "uint"
  storage = "stack:0x8"

[[function]]
va = 0x00507CE0
name = "AdvanceGameRNG_Low16"
