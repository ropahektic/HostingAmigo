[[function]]
va = 0x0058D830
name = "Connection__Send"
calling_convention = "__thiscall"
custom_storage = true
plate_comment = "Wire send: winsock send() of `len` bytes from `buf` over the connection socket (this+0x8c). Shared slot 13 (vtable+0x34) across every Connection vtable, so this is the single chokepoint for all outbound frame/lobby traffic. Returns 1."

  [function.signature]
  returns = "int"

  [[function.param]]
  name = "this"
  type = "void *"
  storage = "ECX"

  [[function.param]]
  name = "buf"
  type = "char *"
  storage = "stack:0x4"

  [[function.param]]
  name = "len"
  type = "int"
  storage = "stack:0x8"

  [[function.param]]
  name = "flags"
  type = "int"
  storage = "stack:0xC"

