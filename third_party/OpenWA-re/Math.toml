[[function]]
va = 0x005758E0
name = "Math__mul_signed96_by_four_thirds"
calling_convention = "__fastcall"
plate_comment = """
Multiplies a 96-bit signed integer by 4/3, with sign-correct rounding.

Implements `(input * 0x55555556 + rounding) >> 30` using carry-propagating
32-bit chunks. `0x55555556 = (2^32 + 2) / 3`, so the result is
`round(input * 4 / 3)`. The 96-bit input lives at `*input_ptr` as three
little-endian u32s; the high word is sign-extended. Only the low 32 bits
of the i64 return are used by callers (assigned to Fixed* outputs).

Sole caller: `WormEntity__ApplyWind` (0x004FFAF0). Companion to
`Math__mul_signed64_by_four_thirds_to_fixed` (0x575AD0) which does the
same operation on a 64-bit input but folds in a Q16 left-shift for raw
integer inputs.
"""

  [function.signature]
  returns = "longlong"

  [[function.param]]
  name = "input"
  type = "int *"

[[function]]
va = 0x00575AD0
name = "Math__mul_signed64_by_four_thirds_to_fixed"
calling_convention = "__stdcall"
plate_comment = """
Multiplies a 64-bit signed integer by 4/3 and shifts left by 16, producing
a Fixed (Q16.16) result. Net formula: `(input * 0x55555556) >> 14`.

Same `0x55555556 = (2^32 + 2) / 3` magic constant as
`Math__mul_signed96_by_four_thirds`; the smaller shift (14 vs 30) folds
in the `<< 16` Fixed conversion. Used when the input is a raw integer
product that needs to land in a Fixed output slot.

Callers: `WormEntity__ApplyWind` (0x004FFE1A) and
`CollisionManager__apply_callback` (0x004FC8EA). Both pre-compute the
i64 input via `IMUL` and push EDX:EAX before the call.
"""

  [function.signature]
  returns = "uint"

  [[function.param]]
  name = "input_lo"
  type = "uint"

  [[function.param]]
  name = "input_hi"
  type = "uint"
