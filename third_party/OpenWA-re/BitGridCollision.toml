[[vtable]]
name = "BitGridCollisionVtable"
va = 0x00664118
size = 8
plate_comment = """
BitGrid collision vtable (0x664118, 8 slots). Bit-level spatial query
operations. Shares fill_hline/fill_vline implementations with the base
vtable, but has distinct get/put methods for bit-level access including
unchecked variants.
"""

  [[vtable.slot]]
  index = 0
  name = "fill_rect"
  wa_function = "BitGridCollision__FillRect"
  doc = "fill rectangle — bit-level fill (0x4F8F90, RET 0x14)"

  [[vtable.slot]]
  index = 1
  name = "fill_hline"
  wa_function = "BitGrid__FillHLine_Shared"
  doc = "fill horizontal line — bit-level, shared with base (0x4F67B0, RET 0x10)"

  [[vtable.slot]]
  index = 2
  name = "fill_vline"
  wa_function = "BitGrid__FillVLine_Shared"
  doc = "fill vertical line — bit-level, shared with base (0x4F6860, RET 0x10)"

  [[vtable.slot]]
  index = 3
  name = "destructor"
  wa_function = "BitGrid__Destructor"
  doc = "destructor — shared across all variants (0x4F5DE0, RET 0x4)"

  [[vtable.slot]]
  index = 4
  name = "get_clipped"
  wa_function = "BitGridCollision__GetClipped"
  doc = "get bit (clipped) — bit-level read with bounds check (0x4F9020, RET 0x8)"

  [[vtable.slot]]
  index = 5
  name = "put_clipped"
  wa_function = "BitGridCollision__PutClipped"
  doc = "set bit (clipped) — bit-level write with bounds check (0x4F9050, RET 0xC)"

  [[vtable.slot]]
  index = 6
  name = "get"
  wa_function = "BitGridCollision__Get"
  doc = "get bit (unchecked) — direct bit read (0x4F5D70, RET 0x8)"

  [[vtable.slot]]
  index = 7
  name = "put"
  wa_function = "BitGridCollision__Put"
  doc = "set bit (unchecked) — direct bit write (0x4F5DA0, RET 0xC)"
