name = "GfxDirVtable"
va = 0x0066B280
size = 4
plate_comment = """
GfxDir (formerly named `GfxHandler`) vtable — 4 slots at 0x0066B280.

Provides a generic file I/O + cache-lookup interface for `.dir` sprite
archives. Slot 0 reads bytes, slot 1 seeks absolute, slot 2 returns a
cached data pointer (no-op in the base impl), slot 3 releases resources.
"""

  [[vtable.slot]]
  index = 0
  name = "read"
  wa_function = "GfxHandler__Read"
  doc = "Slot 0 (0x58BBD0): Read `size` bytes into `buf`. Returns bytes read."

  [[vtable.slot]]
  index = 1
  name = "seek"
  wa_function = "GfxHandler__Seek"
  doc = "Slot 1 (0x58BBB0): Absolute seek — `fseek(file, offset, SEEK_SET)`. Returns 1 on success."

  [[vtable.slot]]
  index = 2
  name = "load_cached"
  wa_function = "GfxHandler__LoadCached"
  doc = "Slot 2 (0x571AF0): Return cached data pointer for `entry_val`, or null if not mapped."

  [[vtable.slot]]
  index = 3
  name = "release"
  wa_function = "GfxHandler__Release"
  doc = "Slot 3 (0x58BB70): Release resources; if `flags & 1`, free the object."
