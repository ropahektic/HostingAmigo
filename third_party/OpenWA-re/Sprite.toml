[[function]]
va = 0x00565D60
name = "Sprite__GetUnderwaterVariant"
calling_convention = "__fastcall"
plate_comment = "Sparse jump-table remap of an in-air sprite ID (low 16 bits) to its underwater/drowning variant. The high 16 bits (transform flags) are preserved verbatim; only the index is rewritten when a mapping exists, otherwise the input is returned unchanged. Free helper (no Sprite* this) — called by every entity render path that has a submerged sprite (mines, missiles, oil drums, arrows, crosses, canisters, crates)."

  [function.signature]
  returns = "uint"

  [[function.param]]
  name = "sprite"
  type = "uint"

