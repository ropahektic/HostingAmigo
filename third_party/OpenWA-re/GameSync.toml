plate_comment = "Builds the host's own peer announce/identity TLV record (magic 0x697EE15E) into the 0x31-byte buffer at ESI (0x8779F5): version (0x0088E454), port (0x0088DFB0), value 500, machine-id (0x007C0C3C ^ 0xD25899A7), PE-checksum-derived key (^ 0x15E3986B). usercall: ESI=buf, no stack args, RET 0."

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "buf"
  type = "void *"
  storage = "ESI"

[[function]]
va = 0x0058F610
name = "GameSync__DecodePeerRecord"
calling_convention = "__stdcall"
custom_storage = true
plate_comment = "Decodes a peer announce TLV record (src=EDX, e.g. the host's at 0x8779F5) into the 0x20-byte peer descriptor at ESI (e.g. 0x87D110): id, flags, team-count cap (<=8), port, machine-id key, checksum. usercall: ESI=dst, EDX=src, no stack args, RET 0."

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "dst"
  type = "void *"
  storage = "ESI"

  [[function.param]]
  name = "src"
