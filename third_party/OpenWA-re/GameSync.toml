plate_comment = "Opens the host's listening socket on `conn` (the host GameSync singleton 0x7C0ED4): bind + listen(backlog 5) on the TCP game port, UDP-broadcast presence. 12 stack params, RET 0x30. The 8 cfg dwords are two copies of the protocol GUID {2540C221-6DA8-11D2-BB5E-00A0C9446D67} baked into .rdata (DAT_00649C14..30)."

