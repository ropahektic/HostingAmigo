[[function]]
va = 0x0058E9E0
name = "GameSync__OpenSockets"
calling_convention = "__stdcall"
custom_storage = true
plate_comment = "Creates + binds the transport sockets on `conn` (EAX): the game socket at conn+0x968C0 (transport=1 -> AF_INET/SOCK_STREAM TCP bound INADDR_ANY:port; transport=0 -> AF 6 non-IP) plus, when want_broadcast, the UDP discovery sockets on ports 0x4272/0x4274. `notify_src+0xc` supplies the WSAAsyncSelect HWND (the shared 'Socket Event Window' on the 0x7C0A60 network object). usercall: EAX=conn, 4 stack params, RET 0x10. Returns 1 on success."

  [function.signature]
  returns = "int"

  [[function.param]]
  name = "conn"
  type = "void *"
  storage = "EAX"

  [[function.param]]
  name = "notify_src"
  type = "void *"
  storage = "stack:0x4"

  [[function.param]]
  name = "transport"
  type = "int"
  storage = "stack:0x8"

  [[function.param]]
  name = "want_broadcast"
  type = "int"
  storage = "stack:0xc"

  [[function.param]]
  name = "port"
  type = "int"
  storage = "stack:0x10"

