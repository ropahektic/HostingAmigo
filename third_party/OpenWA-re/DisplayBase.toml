  name = "vtable"
  type = "DisplayBaseVtable *"
  size = 0x4

[[vtable]]
name = "DisplayBaseVtable"
va = 0x006645F8
size = 40
plate_comment = """
DisplayBase primary vtable (40 slots, 0x6645F8). Transient — assigned by
DisplayBase__Constructor, then immediately overwritten by either
DisplayGfx__Constructor_Maybe (→ DisplayGfxVtable @ 0x66A218, headful) or
GameEngine__InitHardware (→ DisplayBase__HeadlessVtable @ 0x66A0F8,
headless). No live instance retains this vtable past its constructor
chain, so no virtual call dispatches through it at runtime.

Most slots are _purecall (0x5D4E16). Slots 4..=10 and 30..=36 happen to
share the same concrete DisplayGfx implementations referenced by the two
overlays — see DisplayGfxVtable for the full documentation. Slot 0
(destructor) is the DisplayGfx destructor at 0x5660A0, not the canonical
DisplayGfx__Destructor at 0x569CE0.

The DLL's display_vtable::install() rewrites every remaining _purecall
slot to noop_thiscall as a safety net for any virtual call that does
manage to fire during the constructor window.
"""

