[[vtable]]
name = "DisplayBaseHeadlessVtable"
va = 0x0066A0F8
size = 40
plate_comment = """
Headless overlay vtable (40 slots, 0x66A0F8). Installed by
GameEngine__InitHardware (0x56D4D2) onto a DisplayBase instance when the
game runs in headless / `/getlog` mode (the gi+0xF914 branch). This is
the live vtable for the headless renderer — replay-test runs all dispatch
through here, never through DisplayGfxVtable.

Slot pattern:
- Drawing slots (most of 11..=29 + 37..=39) point at tiny return-only
  stubs (FUN_00482860, FUN_00541020, FUN_005660d0, FUN_00566190, ...) so
  the renderer becomes a no-op without losing simulation work.
- Data-query / loader slots (4..=10, 30, 31, 33..=36) point at the SAME
  concrete DisplayGfx implementations referenced by DisplayGfxVtable —
  sprite/font metadata and asset loading still need to work in headless.
  Hooks on these slots must be applied to BOTH vtables.
- Slot 0 (headless destructor) and slot 1 (headless dimensions) are
  headless-specific implementations distinct from the DisplayGfx versions.
"""

