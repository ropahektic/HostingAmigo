plate_comment = """
DisplayBase — base class of the display subsystem hierarchy (0x3560 bytes).
Holds the sprite cache, font/sprite tables, palette slot allocator, and
clip rect state. Extended by DisplayGfx (vtable 0x66A218).
"""

