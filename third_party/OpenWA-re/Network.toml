[[function]]
va = 0x00466F70
name = "Network__BuildPeerConnectionsArray"
calling_convention = "__stdcall"
custom_storage = true
plate_comment = "Builds the launch-time peer connection pointer array used by GameSession::Run. EAX = out base; clears 0x34 bytes at out+4 then fills it with &g_PeerStates[idx] pointers. If DAT_008779E0 != 0 (offline/local) writes a single &DAT_00857A3C and returns 1; otherwise walks CPlayers machine slots 1..N (base this+0xF0 = 0x877AC8, stride 0x78), and for each active machine (flag at +0x80) stores &g_PeerStates + (record+0x78 peer_state_idx word)*0x19118. Returns the connection count. usercall: EAX=out_array, no stack args, RET 0."

  [function.signature]
  returns = "int"

  [[function.param]]
  name = "out_array"
  type = "void *"
  storage = "EAX"

[[function]]
va = 0x004B5F30
name = "Network__DispatchPeerMessages"
calling_convention = "__stdcall"
custom_storage = true
plate_comment = "Host lobby per-tick peer-message pump, called from CNetworkHost__OnTimer (timer id 0x43484551) while dialog+0x138 != 0. Walks the g_PeerStates array (base 0x7C1078, stride 0x19118): for each peer in state 3 dispatches one queued message via Network__ProcessPeerMessage (peer+0xbd==0) or CNetHostCommonDlg__sub_4AC570, then the peer's vtable[7] (+0x1c); peers with a pending dangling-machine id run the CPlayers__ClearMachine/ShowTeams cleanup. usercall: EDI = lobby dialog this (CNetworkHost), no stack args, RET 0."

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "lobby_dlg"
  type = "void *"
  storage = "EDI"

[[function]]
va = 0x004B6AF0
name = "Network__ProcessPeerMessage"
calling_convention = "__stdcall"
plate_comment = "Host lobby: receive + dispatch one queued peer message for peer `peer_idx`. The wire bytes are read via the peer's MsgConnection recv method INTO the lobby dialog's own buffer at lobby_dlg+0x140 (max 0xFDE8 bytes); the opcode at +0x140 then drives a 0x2d-case jump table (switch base 0x004B7780). The join-announce case parses the joining machine's name from lobby_dlg+0x142, validates it (CPlayers__FindMachineByName), checks security checksums from lobby_dlg+0x5F.., copies the name into the peer-state record (g_PeerStates[idx]+0x14148-region), and refreshes the team/machine UI. Inseparable from a real CNetworkHost dialog object — the dialog IS the recv buffer + parse workspace. Returns 1 if a message was handled. RET 0x8."

  [function.signature]
  returns = "char"

  [[function.param]]
  name = "lobby_dlg"
  type = "void *"

  [[function.param]]
  name = "peer_idx"
  type = "int"

