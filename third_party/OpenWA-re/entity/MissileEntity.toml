[[vtable]]
name = "MissileEntityVtable"
va = 0x00664438
size = 20
parent_vtable = "WorldEntityVtable"
plate_comment = """
MissileEntity vtable — 20 slots (shares WorldEntity's layout). Overrides
slot 1 (Free), slot 2 (HandleMessage), and slot 8 (OnContact) with
missile-specific handlers; declares slot 14 (set_terminate_flag,
inherited stub at WorldEntity__SetTerminateFlag_Maybe) so Rust callers
can reach it via the typed bind impl. Remaining slots inherit from
WorldEntity via `parent_vtable`.
"""

  [[vtable.slot]]
  index = 1
  name = "free"
  wa_function = "MissileEntity__Free"
  doc = "Free (slot 1) — calls inlined `dtor1` (0x005086F0) and frees the heap allocation when bit 0 of `flags` is set."

  [[vtable.slot]]
  index = 2
  name = "handle_message"
  wa_function = "MissileEntity__HandleMessage"
  doc = "HandleMessage (slot 2) — processes missile messages (frame finish, render, explosion, detonate, move, homing, etc.)."

  [[vtable.slot]]
  index = 8
  name = "on_contact"
  wa_function = "MissileEntity__OnContact"
  doc = "OnContact (slot 8) — dispatches by `missile_type` (Standard/Cluster/Homing/Animal/Digger)."

  [[vtable.slot]]
  index = 14
  name = "set_terminate_flag"
  wa_function = "WorldEntity__SetTerminateFlag_Maybe"
  doc = "SetTerminateFlag (slot 14, inherited stub) — writes `flag` to subclass terminate slot (entity +0x44)."
