  offset = 0xC0
  name = "rope_anchor_x"
  type = "Fixed"
  comment = "Rope anchor X (terrain endpoint of ninja/bungee rope). Set by `InitWormAttachedRope`; read by `WormEntity::DrawAttachedRope`. Meaningless when `rope_attached == 0`."

  [[struct.field]]
  offset = 0xC4
  name = "rope_anchor_y"
  type = "Fixed"
  comment = "Rope anchor Y (terrain endpoint of ninja/bungee rope). Set by `InitWormAttachedRope`; read by `WormEntity::DrawAttachedRope`. Meaningless when `rope_attached == 0`."

  [[struct.field]]
  offset = 0xC8
  name = "_field_c8"
  type = "uint"
  comment = "Snapshot slot saved/restored by WorldEntity::StepRopePhysics_Maybe (0x005003D0) / RestoreKamikazeState_Maybe (0x00500630) via the static scratch buffer at 0x0077430C. Purpose TBD."

  [[struct.field]]
  offset = 0xCC
  name = "_field_cc"
  type = "Fixed"
  comment = "Per-entity explosion-knockback scale. Default `1.0`."

  [[struct.field]]
  offset = 0xD0
  name = "rope_segment_count"
  type = "int"
  comment = "Segment count for the `rope_segments` buffer on a rope-attached worm. Seeded by `InitWormAttachedRope` as `(rope_length / 8) + 1`, capped at 64; saved/restored alongside `rope_segments` by `StepRopePhysics_Maybe` / `RestorePhysicsSnapshot_Maybe` via the static scratch buffer at 0x00774318."

  [[struct.field]]
  offset = 0xD4
  name = "damage_accum"
  type = "int"
  comment = "Per-entity damage accumulator. `WorldEntity::HandleMessage` (msg=0x1c Explosion) adds falloff-adjusted damage here."

  [[struct.field]]
  offset = 0xD8
  name = "_field_d8"
  type = "byte"
  comment = "Byte-write zeroed by `WorldEntity::Constructor`."

  [[struct.field]]
  offset = 0xD9
  name = "_field_d9"
  type = "byte"
  comment = "Byte-write zeroed by `WorldEntity::Constructor`."

  [[struct.field]]
  offset = 0xDC
  name = "collision_helper"
  type = "void *"
  comment = "Per-entity collision-shape helper. Seeded from `world + 0x464 + flag*4` via the CollisionManager back-pointer. Read by `WorldEntity::check_move_collision`."

  [[struct.field]]
  offset = 0xE0
  name = "sound_handle"
  type = "uint"
  comment = "Owned sound-emitter handle, 0 when no sound is held. Cleared each frame by `WorldEntity::HandleMessage` (msg=0x02 FrameFinish) once the sound finishes."

  [[struct.field]]
  offset = 0xE4
  name = "rope_segments"
  type = "RopeSegment *"
  comment = "64-element RopeSegment ring allocated by InitWormAttachedRope (0x005008D0) when a worm grabs a rope (ninja or bungee); null otherwise. Lifetime gated by `rope_attached`; the WorldEntity destructor `WA_Free`s this iff `rope_attached != 0`. Saved/restored together with `rope_segment_count` by StepRopePhysics_Maybe / RestorePhysicsSnapshot_Maybe."

  [[struct.field]]
  offset = 0xE8
  name = "sound_emitter"
  type = "SoundEmitter"
  type_namespace = "/OpenWA"
  comment = "Embedded sound-emitter sub-object (MSVC multiple inheritance)."

[[vtable]]
name = "WorldEntityVtable"
va = 0x006641F8
size = 20
parent_vtable = "BaseEntityVtable"
plate_comment = """
20-slot vtable shared by every WorldEntity derivative — subclass vtables
(e.g. WormEntityVtable) layer their own overrides on top of the same
shape. Only slots dispatched from Rust are spelled out; the rest fall
through to `_slot_N: usize` placeholders.

The first 7 slots are inherited from BaseEntityVtable (WriteReplayState,
Free, HandleMessage, stubs, ProcessChildren, ProcessFrame); slots 7+
extend with WorldEntity-specific methods. Subclasses (WormEntity,
MineEntity, MissileEntity, OilDrumEntity, etc.) override individual
slots without changing the size.
"""

  [[vtable.slot]]
  index = 10
  name = "on_land_slide"
  doc = "OnLandSlide — secondary landing / slide-physics callback. Called by `WorldEntity::StepRopePhysics_Maybe` on the colliding entity after each `projectile` sub-step that returned a hit. Polymorphic across subclasses (WormEntity overrides at 0x0050D820 with `WormEntity__OnLandSlide`)."

    [vtable.slot.signature]
    calling_convention = "__thiscall"
    returns = "void"

      [[vtable.slot.signature.param]]
      name = "this"
      type = "WorldEntity *"

      [[vtable.slot.signature.param]]
      name = "hit_entity"
      type = "WorldEntity *"

  [[vtable.slot]]
  index = 17
  name = "add_impulse"
  wa_function = "WorldEntity__AddImpulse"
  doc = "AddImpulse — divides each axis by mass at `+0x4c`, accumulates into `speed_x`/`speed_y`, adds `dz` raw to `+0x98`. Bails (returns 0) when `+0x48` is non-zero — the slot doubles as HP on receiver subclasses."
