[[vtable]]
name = "MineEntityVtable"
va = 0x006643E8
size = 32
parent_vtable = "WorldEntityVtable"
plate_comment = """
MineEntity vtable — 32 slots. Extends WorldEntity's 20-slot layout with
12 mine-specific slots (20..31), of which slot 19 (RollFuseFromReplay)
is the only one currently dispatched from Rust. Overrides slot 1 (Free),
slot 2 (HandleMessage), slot 7 (ProcessFrame); declares slot 14
(set_terminate_flag, inherited stub at WorldEntity__SetTerminateFlag_Maybe)
so Rust callers can reach it via the typed bind impl. Remaining
WorldEntity-shape slots inherit via `parent_vtable`.
"""

  [[vtable.slot]]
  index = 1
  name = "free"
  wa_function = "MineEntity__Free"
  doc = "Free (slot 1) — scalar deleting destructor. Called by HandleMessage after a real detonation, after an off-bottom drop, or from the dud-smoke-and-flee path's tail."

  [[vtable.slot]]
  index = 2
  name = "handle_message"
  wa_function = "MineEntity__HandleMessage"
  doc = "HandleMessage (slot 2) — processes mine messages (arm, trigger, detonate)."

  [[vtable.slot]]
  index = 7
  name = "process_frame_inner"
  wa_function = "MineEntity__ProcessFrame"
  doc = "MineEntity-specific tick (slot 7) — per-frame mine update. Distinct from inherited slot-6 process_frame; layered by WorldEntity-shape subclasses."

  [[vtable.slot]]
  index = 14
  name = "set_terminate_flag"
  wa_function = "WorldEntity__SetTerminateFlag_Maybe"
  doc = "SetTerminateFlag (slot 14, inherited stub) — writes `flag` to subclass terminate slot (entity +0x44)."

  [[vtable.slot]]
  index = 19
  name = "roll_fuse_from_replay"
  wa_function = "MineEntity__RollFuseFromReplay"
  doc = "RollFuseFromReplay (slot 19) — rolls a fresh fuse timer from the gameplay RNG when `fuse_timer < 0`. Ported; slot retained for type/registry metadata."
