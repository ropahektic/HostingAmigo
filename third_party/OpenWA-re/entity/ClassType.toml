# Entity classification tag stored at `BaseEntity + 0x20`. Set to `Entity`
# (1) by `BaseEntity::LinkToParent`; every subclass constructor overwrites
# it with the matching variant. Used as a bucket index into
# `CollisionManager.per_class` (capacity 32, so values up to 33 are valid
# but only 0..32 are bucket-indexable). Mirrored in Rust as
# `openwa_game::game::class_type::ClassType`.

[[enum]]
name = "ClassType"
namespace = "/OpenWA"
size = 4
rust_path = "openwa_game::game::class_type::ClassType"

  [enum.variant]
  None = 0
  Entity = 1
  GameEntity = 2
  GameCollisionEntity = 3
  Control = 4
  Game = 5
  WorldRoot = 6
  Filter = 7
  Mine = 8
  Canister = 9
  Team = 10
  Missile = 11
  Arrow = 12
  Animation = 13
  Dirt = 14
  Crate = 15
  Flame = 16
  AirStrike = 17
  Worm = 18
  OldWorm = 19
  Drill = 20
  Cross = 21
  Smoke = 22
  Cloud = 23
  Fire = 24
  Gas = 25
  Girder = 26
  SeaBubble = 27
  Land = 28
  ScoreBubble = 29
  OilDrum = 30
  Cpu = 31
  SpriteAnimation = 32
  CollisionManager = 33
