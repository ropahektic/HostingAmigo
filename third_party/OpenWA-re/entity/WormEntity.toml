[[struct]]
name = "WormEntity"
namespace = "/OpenWA"
size = 0xFB0
rust_path = "openwa_game::entity::worm::WormEntity"

  [[struct.field]]
  offset = 0x0
  name = "vtable"
  type = "WormEntityVtable *"
  type_namespace = "/OpenWA"
  size = 0x4
  comment = "Pointer to WormEntityVtable. Added by `openwa-re retype-entity-vtables`."

[[vtable]]
name = "WormEntityVtable"
va = 0x006644C8
size = 20
parent_vtable = "WorldEntityVtable"
plate_comment = """
WormEntity vtable — 20 slots, same shape as WorldEntityVtable. WormEntity
overrides 14 of the 20 inherited BaseEntity/WorldEntity slots; 6 slots
pass through unchanged (those become `_slot_N: usize` placeholders).

Slot map by vtable byte offset:
  0  WriteReplayState     (BaseEntity, overridden)
  1  Free                 (BaseEntity, overridden)
  2  HandleMessage        (BaseEntity, overridden)
  3  GetEntityData        (BaseEntity, overridden)
  4  (stub, returns 0)    (inherited)
  5  ProcessChildren      (inherited)
  6  ProcessFrame         (inherited)
  7  OnContactEntity      (WorldEntity, overridden)
  8  OnWormPush           (WorldEntity, overridden)
  9  OnLandBounce         (WorldEntity, overridden)
 10  OnLandSlide          (WorldEntity, overridden)
 11  OnSink               (WorldEntity, overridden)
 12  (inherited)          (WorldEntity)
 13  OnKilled             (WorldEntity, overridden)
 14  SetState             (WormEntity, new)
 15  CheckPendingAction   (WormEntity, new)
 16  IsNotOnRope          (WormEntity, new)
 17  (inherited)          (WorldEntity slot 17, AddImpulse)
 18  GetTeamIndex         (WormEntity, new)
 19  (inherited)          (WorldEntity)
"""

  [[vtable.slot]]
  index = 0
  name = "write_replay_state"
  wa_function = "WormEntity__WriteReplayState"
  doc = "WriteReplayState — serializes worm state to a replay stream."

  [[vtable.slot]]
  index = 1
  name = "free"
  wa_function = "WormEntity__Free"
  doc = "Free — calls inner destructor, then `_free(this)` if flags & 1."

  [[vtable.slot]]
  index = 2
  name = "handle_message"
  wa_function = "WormEntity__HandleMessage"
  doc = "HandleMessage — processes all EntityMessages sent to this worm."

  [[vtable.slot]]
  index = 3
  name = "get_entity_data"
  wa_function = "WormEntity__GetEntityData"
  doc = "GetEntityData — returns worm data by query code."

  [[vtable.slot]]
  index = 7
  name = "on_contact_entity"
  wa_function = "WormEntity__OnContactEntity"
  doc = "OnContactEntity — handles physical contact with another entity."

  [[vtable.slot]]
  index = 8
  name = "on_worm_push"
  wa_function = "WormEntity__OnWormPush"
  doc = "OnWormPush — post-contact worm-worm push impulse."

  [[vtable.slot]]
  index = 9
  name = "on_land_bounce"
  wa_function = "WormEntity__OnLandBounce"
  doc = "OnLandBounce — worm lands on terrain; plays thud sound, bounce physics."

  [[vtable.slot]]
  index = 10
  name = "on_land_slide"
  wa_function = "WormEntity__OnLandSlide"
  doc = "OnLandSlide — secondary landing callback; sliding/friction physics."

  [[vtable.slot]]
  index = 11
  name = "on_sink"
  wa_function = "WormEntity__OnSink"
  doc = "OnSink — worm sinks in water/acid; transitions to drowning state."

  [[vtable.slot]]
  index = 13
  name = "on_killed"
  wa_function = "WormEntity__OnKilled"
  doc = "OnKilled — worm death; plays death sound, transitions to dead state."

  [[vtable.slot]]
  index = 14
  name = "set_state"
  wa_function = "WormEntity__SetState"
  doc = "SetState — worm state machine; handles all state transitions."

  [[vtable.slot]]
  index = 15
  name = "check_pending_action"
  wa_function = "WormEntity__CheckPendingAction"
  doc = "CheckPendingAction — if field +0xBC is set, calls SetState(0x73)."

  [[vtable.slot]]
  index = 16
  name = "is_not_on_rope"
  wa_function = "WormEntity__IsNotOnRope"
  doc = "IsNotOnRope — returns true if worm state != 0x7C (rope-swinging)."

  [[vtable.slot]]
  index = 18
  name = "get_team_index"
  wa_function = "WormEntity__GetTeamIndex"
  doc = "GetTeamIndex — returns worm's team index (field +0xFC)."
