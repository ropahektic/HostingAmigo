[[function]]
va = 0x00500720
name = "WormEntity__DrawAttachedRope"
calling_convention = "__stdcall"
plate_comment = "WormEntity::DrawAttachedRope — draws the segmented rope polyline + anchor sprite for a worm currently attached to a ninja rope or bungee. The unattached/in-flight rope is drawn by a different (currently-unidentified) function. Operates directly on a WormEntity*. Gated by `rope_attached != 0`. Reads `rope_anchor_x/_y`, `rope_segment_count`, `rope_segments`, and `pos` (worm position = rope's other endpoint). Caller: WormEntity::HandleMessage case 0x3 (RenderScene)."

  [function.signature]
  returns = "void"

  [[function.param]]
