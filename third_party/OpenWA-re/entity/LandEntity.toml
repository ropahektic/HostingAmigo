[[struct]]
name = "LandEntity"
namespace = "/OpenWA"
size = 0x175C
rust_path = "openwa_game::entity::land::LandEntity"
plate_comment = """
Per-game terrain singleton. Allocated 0x177C bytes (memset-zeroed for
0x175C) by `TeamEntity::SpawnLandEntity`. Inherits the WorldEntity
layout at offsets 0x00..0xFB; LandEntity-specific fields start at
+0xFC. The range +0x10C..+0x16EC is an array of 200 stars (28 bytes
each) seeded by `LandEntity::init_stars`; +0x16F0..+0x175C holds the
gradient-palette index table, RNG seed and trailing unused slots
seeded by `LandEntity::InitLandscape`.
"""

  [[struct.field]]
  offset = 0x0
  name = "vtable"
  type = "WorldEntityVtable *"
  type_namespace = "/OpenWA"
  size = 0x4
  comment = "LandEntity uses the parent WorldEntityVtable shape; no LandEntity-specific vtable struct yet."

  [[struct.field]]
  offset = 0xFC
  name = "level_width"
  type = "uint"
  comment = "Copied from `GameWorld::level_width` (+0x77C0) by the constructor."

  [[struct.field]]
  offset = 0x100
  name = "level_height"
  type = "uint"
  comment = "Copied from `GameWorld::level_height` (+0x77C4) by the constructor."

  [[struct.field]]
  offset = 0x104
  name = "_field_104"
  type = "uint"
  comment = "Zeroed by the constructor. Purpose not yet identified."

  [[struct.field]]
  offset = 0x108
  name = "_field_108"
  type = "uint"
  comment = "Zeroed by the constructor. Purpose not yet identified."

  [[struct.field]]
  offset = 0x16EC
  name = "star_count"
  type = "uint"
  comment = "Number of valid entries in the star array (+0x10C..+0x16EC). 200 by default, 0x42 (66) when `world+0x777c != 0` (cavern terrain). Written by `init_stars`."

  [[struct.field]]
  offset = 0x16F0
  name = "gradient_palette_indices"
  type = "uint[20]"
  size = 0x50
  comment = "Up to 20 unique palette indices sampled from column 0 of the active gradient image. Written by `InitLandscape`."

  [[struct.field]]
  offset = 0x1740
  name = "gradient_palette_count"
  type = "uint"
  comment = "Number of valid entries in `gradient_palette_indices` (0..20). Written by `InitLandscape`."

  [[struct.field]]
  offset = 0x1744
  name = "star_rng_state"
  type = "uint"
  comment = "LCG seed used by `init_stars` (`x = x*0x19660d + 0x3c6ef35f`). Initialised to the sentinel 0x87654321 by `InitLandscape`."

  [[struct.field]]
  offset = 0x1748
  name = "_field_1748"
  type = "uint"
  comment = "Zeroed by `InitLandscape`. Purpose not yet identified."

  [[struct.field]]
  offset = 0x174C
  name = "_field_174c"
  type = "uint"
  comment = "Zeroed by `InitLandscape`. Purpose not yet identified."

  [[struct.field]]
  offset = 0x1750
  name = "_field_1750"
  type = "uint"
  comment = "Zeroed by `InitLandscape`. Purpose not yet identified."

  [[struct.field]]
  offset = 0x1754
  name = "_field_1754"
  type = "uint"
  comment = "Zeroed by `InitLandscape`. Purpose not yet identified."

