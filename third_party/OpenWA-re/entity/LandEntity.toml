name = "LandEntity__InitLandscape"
calling_convention = "__stdcall"
custom_storage = true
plate_comment = """
Seeds the headful-only landscape state: stars, wind indicator bitmap,
and the gradient-image palette index table. In headless mode the entire
body short-circuits to just writing `world.entity_land = this` and
zeroing the trailing 5 unused fields. The 0x87654321 sentinel at
+0x1744 is the LCG seed for the star initialiser.
"""

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "this"
  type = "LandEntity *"
  storage = "ESI"

