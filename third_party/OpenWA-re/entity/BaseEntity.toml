[[function]]
va = 0x004FDC70
name = "DwordList__Append"
calling_convention = "__stdcall"
custom_storage = true
plate_comment = """
Generic dword-array append. The list header is 16 bytes:
`[capacity, dirty, count, data_ptr]`. Doubles capacity + re-allocates
via `wa_malloc` / `memcpy` / `WA_Free` when count == capacity, then
writes `value` into `data[count]` and increments `count`.

Reused everywhere a dynamic dword list is needed: BaseEntity's
children array, the `CollisionManager.entities` / `per_class` buckets
at `world.collision_manager`, collision-manager scratch lists, etc.
See `[[struct]] DwordList` in re/CollisionManager.toml.
"""

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "list"
  type = "DwordList *"
  storage = "ESI"

  [[function.param]]
  name = "value"
  type = "void *"
  storage = "stack:0x4"

[[function]]
va = 0x004FDCE0
name = "DwordList__Remove"
calling_convention = "__stdcall"
custom_storage = true
plate_comment = """
Generic dword-array linear search-and-null. Walks `data[0..count]`,
nulls the first slot equal to `value`, sets the list's `dirty` flag
(+0x04) to 1, returns 1. Returns 0 if not found.

Sibling of `DwordList__Append`. Same 16-byte list header. Note that
"remove" leaves a NULL hole — callers must tolerate sparse arrays
(see `BaseEntity::children_data` semantics).
"""

  [function.signature]
  returns = "uint"

  [[function.param]]
  name = "list"
  type = "DwordList *"
  storage = "ECX"

  [[function.param]]
  name = "value"
  type = "void *"
  storage = "EDI"

