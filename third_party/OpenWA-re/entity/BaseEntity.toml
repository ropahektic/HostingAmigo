[[function]]
va = 0x00562520
name = "BaseEntity__LinkToParent"
calling_convention = "__stdcall"
custom_storage = true
plate_comment = """
Second half of `BaseEntity::Constructor`. Splits on `parent`:
- parent != 0 → inherits `shared_data` from the parent, appends `this`
  to the parent's children list (`DwordList__Append(parent+0x8, this)`),
  and stores `parent` at `this+0x4`.
- parent == 0 → allocates a fresh `shared_data` block
  (`wa_malloc(0x420)`, first 0x400 zeroed) and sets `owns_shared_data = 1`.

Always writes `children_hash = 0`, `+0x1c = 0`, `class_type = Entity (1)`,
and `parent = 0` (overwritten on the parent branch).

`__usercall` — `this` arrives in EDI (never re-loaded across the call);
`parent` is the only stack arg. Modelled as `__stdcall + custom_storage`.
"""

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "this"
  type = "BaseEntity *"
  storage = "EDI"

  [[function.param]]
  name = "parent"
  type = "BaseEntity *"
  storage = "stack:0x4"

[[function]]
va = 0x005625A0
name = "BaseEntity__Constructor"
calling_convention = "__stdcall"
plate_comment = """
BaseEntity ctor. Caller passes a heap-allocated (uninitialised) `this`
plus the parent and world pointers. Writes the BaseEntity vtable
(0x00669F8C), initialises the children `DwordList` header at +0x08
(`capacity = 0x10`, `dirty = 0`, `watermark = 0`, `data = wa_malloc(0x60)`
with first 0x40 zeroed), stores the `world` pointer at +0x2C, then chains
into `BaseEntity__LinkToParent(parent)` (which fills +0x04, +0x18..+0x28
and either appends to the parent's children list or allocates a fresh
shared-data block).

The MSVC SEH frame around `wa_malloc + LinkToParent` is purely
partial-failure cleanup and not modelled by the Rust port.
"""

  [function.signature]
  returns = "BaseEntity *"

  [[function.param]]
  name = "this"
  type = "BaseEntity *"

  [[function.param]]
  name = "parent"
  type = "BaseEntity *"

  [[function.param]]
  name = "world"
  type = "GameWorld *"

