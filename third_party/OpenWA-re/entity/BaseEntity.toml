[[struct]]
name = "BaseEntity"
namespace = "/OpenWA"
size = 0x30
rust_path = "openwa_game::entity::base::BaseEntity"
plate_comment = """
Base class for every game object. Subclasses (WorldEntity, TeamEntity,
WormEntity, …) embed `BaseEntity` at offset 0; the inheritance chain
is realised by sharing the first 0x30 bytes.

The +0x08..+0x17 region is the inline children `DwordList` header
(capacity / dirty / watermark / data). `DwordList__Append` and
`DwordList__Remove` operate on it via `BaseEntity + 0x08`.

`shared_data` is a hash table inherited from the parent (or allocated
fresh by the root entity); see `SharedData__Insert` (0x005406A0) for
the keying scheme.
"""

  [[struct.field]]
  offset = 0x0
  name = "vtable"
  type = "BaseEntityVtable *"
  type_namespace = "/OpenWA"

  [[struct.field]]
  offset = 0x4
  name = "parent"
  type = "BaseEntity *"
  type_namespace = "/OpenWA"

  [[struct.field]]
  offset = 0x8
  name = "children_capacity"
  type = "uint"
  comment = "Children-array capacity. Starts at 0x10, doubles on overflow."

  [[struct.field]]
  offset = 0xC
  name = "children_dirty"
  type = "uint"
  comment = "Set to 1 by DwordList__Remove when a child slot is nulled."

  [[struct.field]]
  offset = 0x10
  name = "children_watermark"
  type = "uint"
  comment = "Insert watermark; not decremented on remove. Iterate [0..watermark] and skip nulls."

  [[struct.field]]
  offset = 0x14
  name = "children_data"
  type = "BaseEntity * *"
  type_namespace = "/OpenWA"
  comment = "Sparse children array. Allocated 0x60 bytes initially via wa_malloc."

  [[struct.field]]
  offset = 0x18
  name = "children_hash"
  type = "void *"
  comment = "Set to 0 by BaseEntity::LinkToParent. Role unclear."

  [[struct.field]]
  offset = 0x1C
