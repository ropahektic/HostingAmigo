BaseEntity base vtable — 7 slots shared by all entity types. Every
BaseEntity subclass vtable starts with these 7 slots; subclasses override
individual slots and extend with additional class-specific methods.
WorldEntity adds slots 7+ beyond this base.

Slot map: 0=WriteReplayState, 1=Free, 2=HandleMessage, 3/4=Stub_Returns0
(shared), 5=ProcessChildren, 6=ProcessFrame.
"""

