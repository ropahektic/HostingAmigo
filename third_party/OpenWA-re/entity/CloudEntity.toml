plate_comment = """
CloudEntity vtable — 7 slots. Same base shape as BaseEntity; overrides
slots 0 (WriteReplayState) and 2 (HandleMessage). Does NOT override
ProcessFrame (slot 6) — all update logic is in HandleMessage, responding
to the FrameFinish message.
"""

  [[vtable.slot]]
