rust_path = "openwa_game::entity::cloud::CloudEntity"
plate_comment = """
Airstrike / weather cloud entity. Extends BaseEntity directly (not
WorldEntity). Drifts horizontally with wind, scrolls on a parallax layer,
and renders as a single sprite. Allocation: 0x74 bytes; only 0x54 bytes
initialized.
"""

