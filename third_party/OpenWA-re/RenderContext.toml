[[struct]]
name = "FastcallResult"
namespace = "/OpenWA"
size = 0x8
rust_path = "openwa_game::render::display::context::FastcallResult"
plate_comment = """
Result buffer for RenderContext and Surface __fastcall vtable calls
(ECX = this, EDX = result buffer pointer). The callee writes a result
code (usually an HRESULT) into `value` and returns the EDX buffer
pointer in EAX. Most callers ignore the result.
"""

  [[struct.field]]
  offset = 0x0
  name = "value"
  type = "uint"
  size = 0x4

  [[struct.field]]
  offset = 0x4
  name = "_pad"
  type = "uint"
  size = 0x4

[[struct]]
name = "RenderContext"
namespace = "/OpenWA"
size = 0x1C
rust_path = "openwa_game::render::display::context::RenderContext"
plate_comment = """
RenderContext — CWormsApp rendering dispatch subobject (0x1C bytes).
Wraps the renderer backend (CompatRenderer / OpenGLCPU / DDraw) and
manages the software framebuffer. Stored as a global pointer at
0x79D6D4 (g_RenderContext). All vtable methods use __fastcall:
ECX = this, EDX = *mut FastcallResult.
"""

  [[struct.field]]
  offset = 0x0
  name = "vtable"
  type = "RenderContextVtable *"
  size = 0x4

[[vtable]]
name = "RenderContextVtable"
va = 0x00662EC8
size = 25
plate_comment = """
RenderContext vtable (25 slots, 0x662EC8). All methods use __fastcall:
ECX=this, EDX=*mut FastcallResult, stack args follow. The 8-byte
FastcallResult buffer is allocated by the caller; the callee writes a
result code into +0x0 and returns the EDX buffer pointer in EAX.
"""

