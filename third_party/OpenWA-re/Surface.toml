[[vtable]]
name = "SurfaceVtable"
size = 8
plate_comment = """
Vtable for `Surface` objects allocated by `RenderContext::alloc_surface`
(slot 22). All slots use __fastcall(this, *FastcallResult, ...args).
Every known method writes a constant success code into *result.value;
the "init failed → retry with bpp=4" pattern in `DisplayGfx::DrawTiledBitmap`
is therefore defensive — the underlying impl never reports failure.

No VA: the SURFACE_VTABLE address constant is defined in a sibling
`define_addresses!` block in `openwa-game/src/render/display/context.rs`
(0x00677570). The codegen omits the `pub const` + `AddrEntry` for this
vtable so the legacy const remains canonical.
"""

  [[vtable.slot]]
  index = 0
  name = "slot_0"
  doc = "Unused/destructor placeholder."

  [[vtable.slot]]
  index = 1
  name = "slot_1"
  doc = "Unused placeholder."

