plate_comment = """
CompatRenderer vtable (37 slots, 0x676A90). Slots 0-24 are the primary
display management surface. Slots 25-36 are the offscreen
IDirectDrawSurface-style sub-vtable that is **dead** at runtime — see
the source comment on CompatRendererVtable. All slots are untyped — no
Rust call site dispatches through this vtable.
"""

