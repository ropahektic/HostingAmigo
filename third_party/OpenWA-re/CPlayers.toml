[[function]]
va = 0x0046A9C0
name = "CPlayers__AddMachine"
calling_convention = "__stdcall"
custom_storage = true
plate_comment = "Dialog-free machine registration into the CPlayers singleton (0x008779D8). Validates the names, rejects duplicates (FindMachineByName), finds the first free of 7 machine slots, and writes the record at this+slot*0x78: +0xc machine_name (<=0x10), +0x1d announce_blob (<=0x30, fed to GameSync__DecodePeerRecord), +0x4e addr_str (<=0x28), +0x78 peer_state_idx (word — the g_PeerStates connection slot for this machine; Network__BuildPeerConnectionsArray reads it as `&g_PeerStates + idx*0x19118` for slots 1..N), +0x7c id (int, must be 1..0x32), +0x80 active_flag=1 (the byte DispatchPeerMessages/log_active_machines count, stride 0x78 from 0x00877A58), +0x81=1, +0x83=p6. Writes the peer descriptor to this+slot*0x30+0x5738 and bumps the machine count at this+0x5706. FrontendLobbyHost__Constructor / register_host hand-replicate the slot-0 case. Returns the slot index, or -1 (no slot) / -2 (dup) / -3 (bad name). usercall: EAX=machine_name, 7 stack params, RET 0x1c."

  [function.signature]
  returns = "int"

  [[function.param]]
  name = "machine_name"
  type = "char *"
  storage = "EAX"

  [[function.param]]
  name = "players"
  type = "void *"
  storage = "stack:0x4"

  [[function.param]]
  name = "announce_blob"
  type = "char *"
  storage = "stack:0x8"

  [[function.param]]
  name = "id"
  type = "int"
  storage = "stack:0xc"

  [[function.param]]
  name = "peer_state_idx"
  type = "ushort"
  storage = "stack:0x10"

  [[function.param]]
  name = "addr_str"
  type = "char *"
  storage = "stack:0x14"

  [[function.param]]
  name = "flags"
  type = "uchar"
  storage = "stack:0x18"

  [[function.param]]
  name = "validate_name"
  type = "char"
  storage = "stack:0x1c"

