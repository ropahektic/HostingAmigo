[[function]]
va = 0x005725B0
name = "MouseInput__ReleaseAndCenter"
calling_convention = "__cdecl"
plate_comment = """
Releases the cursor grab and clears all input state — the Alt+G "ungrab
cursor" hotkey handler. Free function operating on g_GameSession; not a
member of MouseInput despite the name (kept under the MouseInput__
prefix for grouping with the other mouse-input lifecycle helpers).

  1. ClipCursor(NULL) — release the cursor clip.
  2. session.mouse_acquired = 0; session.mouse_button_state = 0;
  3. keyboard.clear_key_states() — zero key_state and prev_state.
  4. SetCursorPos(cursor_initial.x, cursor_initial.y) — restore.
  5. FrontendDialog::UpdateCursor(g_InGameFrontendDialog).

Caller: GameSession::WindowProc only (Alt+G key combo with !Ctrl/!Shift
in fullscreen, action 0x47).
"""

  [function.signature]
  returns = "void"

[[function]]
va = 0x00572620
name = "MouseInput__PollAndAcquire"
calling_convention = "__cdecl"
plate_comment = """
Re-grabs mouse + keyboard input after focus regain or a fresh game start.
Free function operating on g_GameSession; not a member of MouseInput
despite the name (kept under the MouseInput__ prefix for grouping with
the other mouse-input lifecycle helpers).

  1. GetCursorPos(&session.cursor_initial) — snapshot for later restore.
  2. cursor_clip_and_recenter() — clip & recenter to the game window.
  3. session.mouse_acquired = 1.
  4. Keyboard::PollState(session.keyboard).
  5. FrontendDialog::UpdateCursor(g_InGameFrontendDialog).

Callers (all WA-side):
  - Unknown__OnSYSCOMMAND — SC_RESTORE / SC_MAXIMIZE branch
  - Unknown__OnACTIVATE — WA_ACTIVE/WA_CLICKACTIVE in fullscreen
  - FUN_004ED701 — focus-restore inner helper
  - GameSession::WindowProc — fallback when WM_*BUTTONDOWN arrives while
    mouse_acquired == 0 (first click after alt-tab).
"""

  [function.signature]
  returns = "void"

