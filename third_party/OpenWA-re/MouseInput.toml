[[function]]
va = 0x0056D2E0
name = "MouseInput__ConsumeDeltaAndButtons"
calling_convention = "__thiscall"
custom_storage = true
plate_comment = """
Mouse delta+button consumer.

__thiscall(this, *out_dx, *out_dy, *out_buttons):
  *out_dx = g_GameSession.mouse_delta_x  (+0x78)
  *out_dy = g_GameSession.mouse_delta_y  (+0x7C)
  let buttons = g_GameSession.mouse_button_state  (+0x88)
  *out_buttons = self.button_armed_latch & buttons
  self.button_armed_latch = self.button_armed_latch | !buttons

A held button only registers once until the next release re-arms its bit.
Reads — does NOT clear the deltas. Pair with MouseInput__ClearDeltas
(0x56D340) if the caller needs to consume-and-zero. Pair with
MouseInput__AckButtonMask (0x56D320) for an alternate AND-only path on
the same `button_armed_latch`.
"""

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "this"
  type = "MouseInput *"
  storage = "ECX"

  [[function.param]]
  name = "out_dx"
  type = "int *"
  storage = "stack:0x4"

  [[function.param]]
  name = "out_dy"
  type = "int *"
  storage = "stack:0x8"

  [[function.param]]
  name = "out_buttons"
  type = "uint *"
  storage = "stack:0xC"

