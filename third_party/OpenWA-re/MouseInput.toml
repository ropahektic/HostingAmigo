name = "MouseInput__AckButtonMask"
calling_convention = "__thiscall"
custom_storage = true
plate_comment = """
Button-mask ACK helper.

__thiscall(this, mask):
  self.button_armed_latch &= ~(g_GameSession.mouse_button_state & mask)

Clears bits in `button_armed_latch` corresponding to currently-held buttons
in `mask`. Used to consume a pending click without polling deltas.
"""

