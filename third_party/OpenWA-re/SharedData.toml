[[function]]
va = 0x004FDF90
name = "SharedData__Lookup"

[[function]]
va = 0x005406A0
name = "SharedData__Insert"
calling_convention = "__stdcall"
custom_storage = true
plate_comment = """
Allocates a 0x30-byte node and inserts it into the 256-bucket hash table at shared_data:
  node[0] = *bucket_head  (next pointer)
  node[1] = key_edi
  node[2] = key_esi
  node[3] = entity        (entity pointer)
  *bucket_head = node

Hash: bucket = (key_esi * 0x11 + key_edi) &amp; 0x800000ff, with sign-bit correction → effectively &amp; 0xff.

All entities in the same game tree share the same shared_data block (BaseEntity+0x24).
Root entities own 0x420 bytes: 256×4 bucket heads (0x000..0x3FF) + 0x20 bytes other.
Called from WormEntity / FilterEntity / BaseEntity::Constructor_Maybe (deserialiser).

See also: SharedData__Remove (0x540700)
"""

  [function.signature]
  returns = "uint"

  [[function.param]]
  name = "shared_data"
  type = "byte *"
  storage = "stack:0x4"

  [[function.param]]
  name = "entity"
  type = "byte *"
  storage = "stack:0x8"

  [[function.param]]
  name = "key_esi"
  type = "uint"
  storage = "ESI"

  [[function.param]]
  name = "key_edi"
  type = "uint"
  storage = "EDI"

[[function]]
va = 0x00540700
name = "SharedData__Remove"
plate_comment = """
SharedData__Remove(shared_data: *mut u8) -> u32
  __usercall: param_1=stack[0], ESI=key_esi, EDI=key_edi

Removes and frees the node from the hash table at shared_data matching (key_edi, key_esi).
Walks the linked list for bucket = (key_esi * 0x11 + key_edi) &amp; 0xff, unlinks and _free()s
the matching node. Returns 1 on success, 0 if not found.

See also: SharedData__Insert (0x5406a0)
"""
