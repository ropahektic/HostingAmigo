[[global]]
va = 0x0066B86C
name = "SoundEmitter__vtable_Maybe"

[[function]]
va = 0x005465B0
name = "SoundEmitter__Destructor"
calling_convention = "__thiscall"
custom_storage = true
plate_comment = """
Sub-object destructor invoked by every WorldEntity destructor on the
embedded SoundEmitter at WorldEntity+0xE8. Stamps the secondary purecall
vtable, then walks `world.active_sounds.entries[0..64]` decrementing
`local_ref_count` for any entry whose `emitter` points back at this
SoundEmitter, and walks the per-emitter local-sound table at
`world+0x7F20` (count at `world+0x8140`, stride 0x24) clearing back-
references.
"""

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "this"
  type = "SoundEmitter *"
  storage = "ECX"

[[struct]]
name = "SoundEmitter"
namespace = "/OpenWA"
size = 0x14
rust_path = "openwa_game::entity::sound_emitter::SoundEmitter"
plate_comment = """
Sound-emitter sub-object embedded in every WorldEntity at +0xE8 via MSVC
multiple inheritance. The `this` pointer for SoundEmitterVtable methods
points to this sub-object, not the containing WorldEntity. `owner`
points back to the WorldEntity.
"""

  [[struct.field]]
  offset = 0x0
  name = "vtable"
  type = "SoundEmitterVtable *"
  size = 0x4

  [[struct.field]]
  offset = 0x4
  name = "world"
  type = "GameWorld *"
  size = 0x4
  comment = "Owning `GameWorld` — copied from owner BaseEntity+0x2c by `WorldEntity::Constructor`."

  [[struct.field]]
  offset = 0x8
  name = "local_ref_count"
  type = "int"
  size = 0x4
  comment = "Incremented when an ActiveSoundEntry holds this emitter; decremented on release."

  [[struct.field]]
  offset = 0xC
  name = "local_sound_count"
  type = "int"
  size = 0x4

  [[struct.field]]
  offset = 0x10
  name = "owner"
  type = "WorldEntity *"
  size = 0x4
  comment = "Back-pointer to the containing WorldEntity."

[[vtable]]
name = "SoundEmitterVtable"
va = 0x00669CF8
size = 12
plate_comment = """
Secondary vtable on every WorldEntity (entity +0xE8) — MSVC multiple-
inheritance secondary table. The named slots (0-4) form the sound-
emitter sub-object's interface; slots 5-11 forward to BaseEntity-shaped
implementations the runtime reuses via shared fn-pointer addresses.
Several slots' .rdata pointers happen to land on functions Ghidra named
after the class that first owned them (e.g. slot 3 → `CloudEntity__Free`,
slot 4 → `SpriteAnimEntity__message`); when dispatched through this
vtable, `this` is a SoundEmitter sub-object, not the named class.
"""

  [[vtable.slot]]
  index = 0
  name = "get_position"
  wa_function = "WorldEntity__SecondaryVT__GetPosition_Maybe"
  doc = "Reads `owner->pos.x/y` (WorldEntity +0x84/+0x88) into two out-pointers."

  [[vtable.slot]]
  index = 1
  name = "get_position_alt"
  wa_function = "WorldEntity__SecondaryVT__Slot1"
  doc = "Reads `owner->+0x38/+0x3c` into two out-pointers. Likely a screen-coords/velocity getter; semantics unconfirmed."

  [[vtable.slot]]
  index = 3
  name = "destructor"
  doc = "Scalar deleting destructor. .rdata pointer resolves to `CloudEntity__Free` (0x00546990); shared by multiple secondary-vtable consumers."

    [vtable.slot.signature]
    calling_convention = "__thiscall"
    returns = "SoundEmitter *"

      [[vtable.slot.signature.param]]
      name = "this"
      type = "SoundEmitter *"

      [[vtable.slot.signature.param]]
      name = "flags"
      type = "uint"

  [[vtable.slot]]
  index = 4
  name = "handle_message"
  doc = "Sound-queue message handler. .rdata pointer resolves to `SpriteAnimEntity__message` (0x00546760); shared across secondary-vtable consumers — Ghidra named the function after the class that first carried it."

    [vtable.slot.signature]
    calling_convention = "__thiscall"
    returns = "void"

