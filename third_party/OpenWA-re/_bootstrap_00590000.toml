name = "Stub_Void_Ret8"
calling_convention = "__thiscall"
custom_storage = true
plate_comment = """
Shared cross-class no-op stub. `RET 0x8` — two stack args plus `this`
in ECX; all ignored, no return value. Used as a vtable slot filler in
~48 vtables across the binary.
"""

  [function.signature]
  returns = "void"

  [[function.param]]
  name = "this"
  type = "void *"
  storage = "ECX"

  [[function.param]]
  name = "p0"
  type = "uint"
  storage = "stack:0x4"

  [[function.param]]
  name = "p1"
  type = "uint"
  storage = "stack:0x8"

