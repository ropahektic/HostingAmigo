[[struct]]
name = "LogicalTeamRecord"
namespace = "/OpenWA"
size = 0x51C
rust_path = "openwa_game::engine::team_arena::LogicalTeamRecord"
plate_comment = """
Logical per-team record as written by GameWorld__InitTeamsFromSetup (0x005220B0). Six of these live back-to-back at TeamArena+0x8, each 0x51C bytes (= same stride as TeamBlock).

Aliasing note: this is a DIFFERENT view of the same memory than TeamBlock / TeamHeader — the two structures overlay each other, shifted by 0x84 bytes. Pick the one whose field offsets match the access you need.
"""

  [[struct.field]]
  offset = 0x0
  name = "name"
  type = "char[16]"
  size = 0x10

  [[struct.field]]
  offset = 0x10
  name = "_unknown_010"
  type = "dword"
  size = 0x4

  [[struct.field]]
  offset = 0x14
  name = "starting_hp_sum"
  type = "dword"
  size = 0x4
  comment = "Sum of starting HPs across all live worms on this team; computed by InitTeamsFromSetup."

  [[struct.field]]
  offset = 0x18
  name = "worms"
  type = "byte[1248]"
  size = 0x4E0
  comment = "Per-worm state — 8 slots of WormEntry (stride 0x9C). Modeled as opaque bytes in TOML since WormEntry isn't mirrored here; the Rust struct types it as `[WormEntry; 8]`. Only the first worm_count entries are initialised; the rest stay heap-zeroed."

  [[struct.field]]
  offset = 0x4F8
  name = "_pad_4f8"
  type = "dword"
  size = 0x4

  [[struct.field]]
  offset = 0x4FC
  name = "eliminated_flag"
  type = "dword"
  size = 0x4
  comment = "Copied (zero-extended) from team_records[i].eliminated_flag."

  [[struct.field]]
  offset = 0x500
  name = "_pad_500"
  type = "dword"
  size = 0x4

  [[struct.field]]
  offset = 0x504
  name = "_pad_504"
  type = "dword"
  size = 0x4

  [[struct.field]]
  offset = 0x508
  name = "weapon_alliance"
  type = "int"
  size = 0x4
  comment = "Sign-extended from team_records[i].owner_player_slot. Indexes the per-alliance ammo/delay table."

  [[struct.field]]
  offset = 0x50C
  name = "_pad_50c"
  type = "dword"
  size = 0x4

  [[struct.field]]
  offset = 0x510
  name = "worm_count"
  type = "dword"
  size = 0x4

  [[struct.field]]
  offset = 0x514
  name = "_pad_514"
  type = "dword"
  size = 0x4

  [[struct.field]]
  offset = 0x518
  name = "turn_order_idx"
  type = "int"
  size = 0x4
  comment = "Sign-extended from team_records[i].turn_order_idx."

