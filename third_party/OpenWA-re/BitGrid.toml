[[vtable]]
name = "BitGridBaseVtable"
va = 0x006640EC
size = 8
plate_comment = """
BitGrid base vtable (8 slots). Bit-level fill/get/put primitives used as
a passive data container or before a subtype-specific vtable is patched
in. Slot 0 (fill_rect) lives in BitmapImage.toml and is cross-class, so
it falls through to a `usize` placeholder. Slots 4-7 are stubs.
"""

  [[vtable.slot]]
  index = 1
  name = "fill_hline"
  wa_function = "BitGrid__FillHLine_Shared"
  doc = "fill horizontal line — bit-level, shared with collision (0x4F67B0, RET 0x10)"

  [[vtable.slot]]
  index = 2
  name = "fill_vline"
  wa_function = "BitGrid__FillVLine_Shared"
  doc = "fill vertical line — bit-level, shared with collision (0x4F6860, RET 0x10)"

  [[vtable.slot]]
  index = 3
  name = "destructor"
  wa_function = "BitGrid__Destructor"
  doc = "destructor — shared across all variants (0x4F5DE0, RET 0x4)"

[[vtable]]
name = "BitGridDisplayVtable"
va = 0x00664144
size = 8
plate_comment = """
BitGrid display-layer vtable (0x664144, 8 slots). Byte-level (8bpp) pixel
buffer operations for rendering layers.

DisplayGfx creates 3 layer objects in DisplayGfx__Init at +0x3D9C / +0x3DA0 /
+0x3DA4.
"""

  [[vtable.slot]]
  index = 0
  name = "fill_rect"
  wa_function = "BitGrid__FillRect"
  doc = "fill rectangle — memset rows [y1..y2) from x1 to x2 with color (0x4F9090, RET 0x14)"

  [[vtable.slot]]
  index = 1
  name = "fill_hline"
  wa_function = "BitGrid__FillHLine"
  doc = "fill horizontal line — memset row y from x1 to x2 with color (0x4F90E0, RET 0x10)"

  [[vtable.slot]]
  index = 2
  name = "fill_vline"
  wa_function = "BitGrid__FillVLine"
  doc = "fill vertical line — set pixels in column x from y1 to y2 (0x4F9110, RET 0x10)"

  [[vtable.slot]]
  index = 3
  name = "destructor"
  wa_function = "BitGrid__Destructor"
  doc = "destructor — shared across all variants (0x4F5DE0, RET 0x4)"

  [[vtable.slot]]
  index = 4
  name = "get_pixel_clipped"
  wa_function = "BitGrid__GetPixelClipped"
  doc = "get pixel (clipped) — returns 0 if outside clip rect (0x4F9140, RET 0x8)"

  [[vtable.slot]]
  index = 5
  name = "put_pixel_clipped"
  wa_function = "BitGrid__PutPixelClipped"
  doc = "put pixel (clipped) — no-op if outside clip rect (0x4F9180, RET 0xC)"

  [[vtable.slot]]
  index = 6
  name = "get_pixel"
  wa_function = "BitGrid__GetPixel"
  doc = "get pixel (unchecked) — direct read, no bounds checking (0x4F5E20, RET 0x8)"

  [[vtable.slot]]
  index = 7
  name = "put_pixel"
  wa_function = "BitGrid__PutPixel"
  doc = "put pixel (unchecked) — direct write, no bounds checking (0x4F5E40, RET 0xC)"
