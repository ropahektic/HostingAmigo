# D3D rendering path — OUT OF SCOPE.
#
# OpenWA replaces WA's DirectX renderer with a Rust-side softbuffer backend
# (see crates/openwa-dll/src/replacements/render/, project memory
# project_softbuffer_backend_status.md). The functions listed here are the
# statically-linked Microsoft D3DX 7 utility library (CD3duXxx) plus the
# D3D7 / D3D9 renderer plugins (Renderer_Direct3D_*); none of them will be
# ported. They remain callable from WA-side init paths via the renderer
# vtables until softbuffer is the only backend; once the DirectX path is
# fully retired they become unreachable.
#
# Set generated by ghidra_scripts/WalkD3DSubsystem.py: all functions in
# [0x005b4944, 0x005c0000) (D3DX) and [0x0059b500, 0x0059d000) (renderer
# plugins), minus shared helpers with non-D3D callers (e.g. __EH_prolog at
# 0x005bc3c4, FUN_005b6083). CRT/delayload thunks outside those ranges
# (__ftol, DirectDrawCreateEx, DirectDrawEnumerateExA) are excluded.

out_of_scope_reason = "D3DX 7 static library + D3D7/D3D9 renderer plugins. OpenWA replaces the renderer with a Rust-side softbuffer backend, so the entire DirectX rendering path is out of porting scope."

